name: DAST (ZAP Baseline)
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize DB and run Flask app
        run: |
          python src/db.py
          nohup python -m flask --app src/app.py run --host=127.0.0.1 --port=5000 > flask.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sSf http://127.0.0.1:5000/ > /dev/null; then
              echo "Flask is up"
              break
            fi
            sleep 1
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@0619037bb784a56e2e06b104f0ebe157e076f075 # v0.13.0
        continue-on-error: true
        with:
          target: 'http://127.0.0.1:5000'
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-a'

      - name: Save ZAP & app artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
            flask.log
