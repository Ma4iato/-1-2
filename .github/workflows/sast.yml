name: SAST
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  semgrep-bandit-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep

      - name: Run Semgrep (auto + custom .semgrep.yml)
        run: |
          semgrep scan --config auto --config .semgrep.yml --sarif --output semgrep.sarif || true
          semgrep scan --config auto --config .semgrep.yml --text --output semgrep.txt || true

      - name: Run Bandit
        run: |
          bandit -r src -f sarif -o bandit.sarif || true
          bandit -r src -f txt -o bandit.txt || true

      - name: Run pip-audit (SCA)
        run: |
          pip-audit -f json -o pip-audit.json || true
          pip-audit -f markdown -o pip-audit.md || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

      - name: Upload SAST & SCA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            semgrep.sarif
            semgrep.txt
            bandit.sarif
            bandit.txt
            pip-audit.json
            pip-audit.md
