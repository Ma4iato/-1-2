name: SAST
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  semgrep-bandit-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies and SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep

      - name: Run security unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Semgrep (auto + custom .semgrep.yml)
        run: |
          semgrep scan --config auto --config .semgrep.yml --sarif --output semgrep.sarif || true
          semgrep scan --config auto --config .semgrep.yml --text --output semgrep.txt || true

      - name: Run Bandit
        run: |
          bandit -r src -f sarif -o bandit.sarif || true
          bandit -r src -f txt -o bandit.txt || true

      - name: Run pip-audit on requirements.txt (SCA)
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit.json || true
          pip-audit -r requirements.txt -f markdown -o pip-audit.md || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

      - name: Upload SAST & SCA artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-reports
          path: |
            semgrep.sarif
            semgrep.txt
            bandit.sarif
            bandit.txt
            pip-audit.json
            pip-audit.md
