services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in environment or .env}
      - DB_PATH=/data/demo.sqlite3
    volumes:
      - ./data:/data
    command: /bin/sh -c "python src/db.py && flask run --host=0.0.0.0 --port=5000"
